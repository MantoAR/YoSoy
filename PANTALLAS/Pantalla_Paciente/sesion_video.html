<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Sesión - YoSoy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f3; margin: 0; padding: 16px; }
        .card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #eee; margin-bottom: 12px; }
        .card h3 { font-size: 12px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing:.05em; margin-bottom: 12px; }
        .videos-grid { display: grid; grid-template-columns: 1fr 200px; gap: 10px; margin-bottom: 12px; }
        .video-wrap { position: relative; background: #111; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; }
        .video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .video-label { position: absolute; bottom: 8px; left: 10px; background: rgba(0,0,0,0.6); color: white; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
        .btn-rojo { background: #A32D2D; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .btn-verde { background: #185FA5; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn-verde:disabled { opacity: 0.5; cursor: default; }
        .estado { font-size: 13px; color: #888; margin-left: 10px; }
        .controles { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .codigo-input { display: flex; gap: 8px; margin-top: 12px; }
        .codigo-input input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0d4f5;
            border-radius: 10px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            color: #185FA5;
            outline: none;
        }
        .codigo-input input:focus { border-color: #185FA5; }
        .estado-box { margin-top: 12px; font-size: 13px; color: #888; }
        .estado-box.conectado { color: #3B6D11; font-weight: 500; }
        .estado-box.error { color: #A32D2D; }
    </style>
</head>
<body>

    <!-- PANTALLA DE ESPERA -->
    <div id="pantalla-espera">
        <div class="card">
            <h3>Unirse a sesión</h3>
            <p style="font-size:13px;color:#666;">
                Tu profesional te va a compartir un código. Ingresalo acá para conectarte a la videollamada.
            </p>
            <div class="codigo-input">
                <input 
                    type="text" 
                    id="input-sala" 
                    placeholder="SALA-X-XXXXXX" 
                    maxlength="30"
                    oninput="this.value = this.value.toUpperCase()"
                >
                <button class="btn-verde" id="btn-conectar" onclick="conectarse()">
                    Conectarme
                </button>
            </div>
            <div class="estado-box" id="estado-espera"></div>
        </div>
    </div>

    <!-- PANTALLA DE SESIÓN -->
    <div id="pantalla-sesion" style="display:none">
        <div class="videos-grid">
            <div class="video-wrap">
                <video id="vid-profesional" autoplay playsinline></video>
                <span class="video-label">Tu profesional</span>
            </div>
            <div class="video-wrap">
                <video id="vid-paciente" autoplay playsinline muted></video>
                <span class="video-label">Vos</span>
            </div>
        </div>
        <div class="controles">
            <button class="btn-rojo" onclick="finalizarSesion()">⏹ Finalizar sesión</button>
            <span class="estado" id="estado-txt">Conectando...</span>
        </div>
    </div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const SIGNAL = 'http://localhost:3001';
let pc, stream, socket, sala;

async function conectarse() {
    sala = document.getElementById('input-sala').value.trim().toUpperCase();
    const estadoBox = document.getElementById('estado-espera');

    if (!sala) {
        estadoBox.textContent = 'Ingresá el código de sala.';
        estadoBox.className = 'estado-box error';
        return;
    }

    estadoBox.textContent = 'Conectando...';
    estadoBox.className = 'estado-box';
    document.getElementById('btn-conectar').disabled = true;

    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch {
        estadoBox.textContent = 'No se pudo acceder a la cámara o micrófono.';
        estadoBox.className = 'estado-box error';
        document.getElementById('btn-conectar').disabled = false;
        return;
    }

    document.getElementById('vid-paciente').srcObject = stream;
    document.getElementById('pantalla-espera').style.display = 'none';
    document.getElementById('pantalla-sesion').style.display = 'block';
    document.getElementById('estado-txt').textContent = 'Conectando con el profesional...';

    // Configurar WebRTC
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    stream.getTracks().forEach(t => pc.addTrack(t, stream));

    pc.ontrack = e => {
        document.getElementById('vid-profesional').srcObject = e.streams[0];
        document.getElementById('estado-txt').textContent = '🟢 Sesión en curso';
    };

    pc.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', { roomId: sala, candidate: e.candidate });
    };

    // Conectar al servidor de señalización
    socket = io(SIGNAL);

    // Cuando el socket se conecta, unirse a la sala
    socket.on('connect', () => {
        socket.emit('join-room', { roomId: sala, role: 'paciente' });
    });

    // El servidor confirma que nos unimos → mandar offer inmediatamente
    socket.on('joined', async () => {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', { roomId: sala, offer });
    });

    // Si el profesional se une después que nosotros → mandar offer
    socket.on('user-joined', async () => {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', { roomId: sala, offer });
    });

    socket.on('answer', async ({ answer }) => {
        await pc.setRemoteDescription(answer);
    });

    socket.on('ice-candidate', async ({ candidate }) => {
        try { await pc.addIceCandidate(candidate); } catch {}
    });

    socket.on('user-left', () => {
        document.getElementById('estado-txt').textContent = '⚠ El profesional se desconectó.';
    });
}

function finalizarSesion() {
    stream?.getTracks().forEach(t => t.stop());
    pc?.close();
    socket?.disconnect();
    document.getElementById('pantalla-sesion').style.display = 'none';
    document.getElementById('pantalla-espera').style.display = 'block';
    document.getElementById('input-sala').value = '';
    document.getElementById('btn-conectar').disabled = false;
    document.getElementById('estado-espera').textContent = 'Sesión finalizada.';
    document.getElementById('estado-espera').className = 'estado-box conectado';
}
</script>
</body>
</html>
