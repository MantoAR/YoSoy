<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy – Panel Profesional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../shared/tema.css">
    <link rel="stylesheet" href="css/nuevo_dashboard.css">
</head>
<body>
<div class="ui-app">

    <!-- Barra lateral de íconos: mismas pestañas de siempre (activarTab usa .tab-btn e id tab-*) -->
    <nav class="ui-sidebar" aria-label="Secciones">
        <div class="ui-sidebar-logo"><img src="../Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="YoSoy"></div>
        <button class="tab-btn ui-nav-item" id="tab-inicio" onclick="activarTab('inicio')" data-label="Inicio" aria-label="Inicio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        </button>
        <button class="tab-btn ui-nav-item" id="tab-agenda" onclick="activarTab('agenda')" data-label="Mi agenda" aria-label="Mi agenda">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
        </button>
        <button class="tab-btn ui-nav-item" id="tab-pacientes" onclick="activarTab('pacientes')" data-label="Mis pacientes" aria-label="Mis pacientes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18.5 14.8c1.7.7 2.8 2.4 3 5.2"/></svg>
        </button>
        <button class="tab-btn ui-nav-item" id="tab-sesion" onclick="activarTab('sesion')" data-label="Sesión" aria-label="Sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="m15.5 10.5 6-3.5v10l-6-3.5"/></svg>
        </button>
        <button class="tab-btn ui-nav-item" id="tab-reportes" onclick="activarTab('reportes')" data-label="Reportes" aria-label="Reportes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        </button>
        <div class="ui-sidebar-espacio"></div>
        <button class="tab-btn ui-nav-item" id="tab-perfil" onclick="activarTab('perfil')" data-label="Mi perfil" aria-label="Mi perfil">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"/></svg>
        </button>
        <button class="ui-nav-item" onclick="cerrarSesion()" data-label="Cerrar sesión" aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>
        </button>
    </nav>

    <div class="ui-main">
        <header class="ui-topbar">
            <div><span class="ui-topbar-titulo">YoSoy</span><span class="ui-topbar-sub">Panel profesional</span></div>
            <div class="ui-topbar-acciones">
                <button class="ui-btn ui-btn--sm" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </header>

        <main class="contenido" id="contenido">
            <div class="spinner">Cargando...</div>
        </main>
    </div>
</div>

<div id="toast-container"></div>

<script src="../js/sesion.js"></script>
<script src="js/nuevo_dashboard.js"></script>
</body>
</html>
