<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy · Ingresar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="shared/tema.css">
    <link rel="stylesheet" href="shared/acceso.css">
    <style>
        /* Pestañas de rol: 2 x 2 (Paciente, Profesional / CRM, Configurador). */
        .acceso-roles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; width: 100%; }
        .acceso-roles button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 8px; white-space: nowrap; }
    </style>
</head>
<body class="acceso">

    <main class="acceso-tarjeta" aria-labelledby="tituloIngreso">
        <div class="acceso-marca">
            <img src="Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="">
            <span class="ui-marca-nombre">Yo<b>Soy</b></span>
            <span class="acceso-sub">Telemedicina en salud mental</span>
        </div>
        <h1 class="sr-only" id="tituloIngreso">Ingresar a YoSoy</h1>

        <!-- Tipo de cuenta -->
        <div class="ui-segmentado acceso-roles" role="group" aria-label="Tipo de cuenta">
            <button type="button" class="rol-btn activo" id="tab-paciente" aria-pressed="true" onclick="seleccionarRol('paciente')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"/></svg>
                Paciente
            </button>
            <button type="button" class="rol-btn" id="tab-profesional" aria-pressed="false" onclick="seleccionarRol('profesional')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v6a6 6 0 0 0 12 0V3M12 15v2a4 4 0 0 0 8 0v-3"/><circle cx="20" cy="12" r="2"/></svg>
                Profesional
            </button>
            <button type="button" class="rol-btn" id="tab-crm" aria-pressed="false" onclick="seleccionarRol('crm')" title="CRM y atención al cliente">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg>
                CRM
            </button>
            <!-- Facturación (Administración de facturación y pagos): el rol ya existe en la base,
                 la pestaña vuelve cuando se programe el módulo (etapa de cobros). -->
            <button type="button" class="rol-btn" id="tab-configurador" aria-pressed="false" onclick="seleccionarRol('configurador')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
                Configurador
            </button>
        </div>

        <form class="acceso-form" id="formIngreso" onsubmit="iniciarSesion(event)" novalidate>
            <div class="ui-campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" class="ui-input" placeholder="Tu nombre de usuario" autocomplete="username" autofocus>
            </div>
            <div class="ui-campo">
                <label for="contrasena">Contraseña</label>
                <div class="campo-clave">
                    <input type="password" id="contrasena" class="ui-input" placeholder="Tu contraseña" autocomplete="current-password">
                    <button type="button" class="ver-clave" id="btnOjo" onclick="togglePassword()" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg id="iconoOjoAbierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg id="iconoOjoCerrado" class="oculto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <div class="ui-alerta ui-alerta--danger oculto" id="errorMsg" role="alert">Usuario o contraseña incorrectos.</div>

            <button type="submit" class="ui-btn ui-btn--primary ui-btn--lg ui-btn--bloque" id="btnIngresar">Ingresar</button>
        </form>

        <p class="acceso-pie" id="linkRegistro">
            ¿No tenés cuenta? <a href="Pantalla_Usuario/Usuario/consentimiento crear_cuenta.html" id="linkRegistroHref">Registrate</a>
        </p>
        <p class="acceso-pie oculto" id="linkRegistroProfesional">
            ¿Sos profesional? <a href="Pantalla_Usuario/Usuario/registro_profesional.html">Pedí tu cuenta acá</a>
        </p>

        <!-- Recuperación de contraseña (solo paciente y profesional): autoservicio, el
             link para elegir la contraseña nueva llega por mail (reset-password.html). -->
        <div id="seccionRecuperacion">
            <div class="acceso-separador" role="presentation"></div>
            <div class="acceso-links">
                <button type="button" class="ui-btn ui-btn--ghost ui-btn--sm" onclick="toggleRecuperacion(event)" aria-controls="formRecuperacion">¿Olvidaste tu contraseña?</button>
            </div>

            <form id="formRecuperacion" class="acceso-desplegable oculto" onsubmit="event.preventDefault(); enviarRecuperacion()" novalidate>
                <div class="acceso-desplegable-fila">
                    <div class="ui-campo">
                        <label for="userRecuperacion">Usuario</label>
                        <input type="text" id="userRecuperacion" class="ui-input" placeholder="Tu nombre de usuario" autocomplete="username">
                    </div>
                    <button type="submit" class="ui-btn ui-btn--primary">Pedir contraseña nueva</button>
                </div>
                <div id="msgRecuperacion" class="ui-alerta mt-12 oculto" role="status"></div>
            </form>
        </div>
    </main>

    <script src="shared/ui.js"></script>
    <script>
        // Escape de HTML para datos que cargan los usuarios. En Cambios-Agus vive en shared/ui.js (YS.esc);
        // en main no existe esa capa, asi que el parche de XSS define lo minimo que usa.
        window.YS = window.YS || {};
        YS.esc = YS.esc || (s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]));
        let rolActual = "paciente";

        // Volver a la reserva por link público (Fase 3a, Paso 3): si llegamos con un
        // "?return=" válido, lo llevamos colgando al link de registro para no perderlo
        // en ese salto — y lo usa iniciarSesion() si el login es el que termina el viaje.
        const retornoPendiente = YS.rutaRetornoValida(new URLSearchParams(location.search).get("return"));
        if (retornoPendiente) {
            const a = document.getElementById("linkRegistroHref");
            a.href = a.href + "?return=" + encodeURIComponent(retornoPendiente);
        }

        function seleccionarRol(rol) {
            rolActual = rol;
            document.querySelectorAll(".rol-btn").forEach(b => {
                const si = b.id === `tab-${rol}`;
                b.classList.toggle("activo", si);
                b.setAttribute("aria-pressed", si);
            });
            document.getElementById("errorMsg").classList.add("oculto");
            document.getElementById("linkRegistro").classList.toggle("oculto", rol !== "paciente");
            document.getElementById("linkRegistroProfesional").classList.toggle("oculto", rol !== "profesional");

            // La recuperación de contraseña la aprueba el Configurador: él no la pide acá.
            const esUserFinal = rol !== "configurador";
            document.getElementById("seccionRecuperacion").classList.toggle("oculto", !esUserFinal);
            if (!esUserFinal) {
                document.getElementById("formRecuperacion").classList.add("oculto");
                document.getElementById("formConsultarSolicitud").classList.add("oculto");
            }
        }

        function togglePassword() {
            const input = document.getElementById("contrasena");
            const mostrar = input.type === "password";
            input.type = mostrar ? "text" : "password";
            document.getElementById("iconoOjoAbierto").classList.toggle("oculto", mostrar);
            document.getElementById("iconoOjoCerrado").classList.toggle("oculto", !mostrar);
            const btn = document.getElementById("btnOjo");
            btn.setAttribute("aria-pressed", mostrar);
            btn.setAttribute("aria-label", mostrar ? "Ocultar contraseña" : "Mostrar contraseña");
        }

        function mostrarError(texto) {
            const e = document.getElementById("errorMsg");
            e.textContent = texto;
            e.classList.remove("oculto");
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            document.getElementById("errorMsg").classList.add("oculto");
            if (!YS.form.validar([
                { id: "usuario", requerido: "Ingresá tu usuario." },
                { id: "contrasena", requerido: "Ingresá tu contraseña." }
            ])) return;
            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;
            const btn = document.getElementById("btnIngresar");
            btn.classList.add("cargando");

            try {
                // sinRedireccion: en el ingreso un 401 es "usuario o contraseña incorrectos", no "sesión vencida"
                const res = await YS.fetch("/login", { method: "POST", json: { username: usuario, password: contrasena, modulo: rolActual }, sinRedireccion: true });

                if (res.status === 423) {
                    mostrarError(await YS.leerMensaje(res, "Cuenta bloqueada temporalmente. Intentá en 15 minutos."));
                    return;
                }
                // 5xx: problema del servidor o base desactualizada (503 con la migración que
                // falta). Se muestra el mensaje real con su código, no "contraseña incorrecta".
                if (res.status >= 500) {
                    mostrarError(await YS.leerMensaje(res));
                    return;
                }
                // 403: sin permisos asignados (etapa 2) u otro rechazo con su propio mensaje.
                if (res.status === 403) {
                    mostrarError(await YS.leerMensaje(res, "Tu usuario no tiene permisos para ingresar."));
                    return;
                }
                if (!res.ok) {
                    mostrarError("Usuario o contraseña incorrectos.");
                    return;
                }

                const data = await res.json();
                // La pestaña elegida viaja al servidor, que responde con el token de ese rol
                // o con un 403 si el usuario no lo tiene (mensaje arriba).
                if (data.requiereModulo) {
                    await YS.sesion.elegirModulo(rolActual, data.tokenSeleccion);
                    return;
                }
                completarIngreso(data);
            } catch (err) {
                // Sin conexión con la API, o un error de la propia pantalla (por ejemplo, el
                // navegador quedó con una versión vieja de ui.js en caché: Ctrl+F5).
                console.error(err);
                mostrarError(err?.sinConexion
                    ? "No se pudo conectar con el servidor. Revisá que la API esté corriendo."
                    : "Ocurrió un error en la pantalla de ingreso. Actualizá con Ctrl+F5 y volvé a intentar. Detalle: " + (err?.message || err));
            } finally {
                btn.classList.remove("cargando");
            }
        }

        function completarIngreso(data) {
            YS.sesion.guardar(data);
            if (data.rol === "paciente") window.location.href = retornoPendiente || "Pantalla_Paciente/dashboard.html";
            else if (data.modulo === "profesional") window.location.href = "Pantalla_Profesional/nuevo_dashboard.html";
            else if (data.modulo === "configurador") window.location.href = "Pantalla_Configurador/dashboard.html";
            else window.location.href = YS.rutaModulo(data.modulo || data.rol);
        }

        function alternarDesplegable(mostrar, msg) {
            const f = document.getElementById(mostrar);
            const abrir = f.classList.contains("oculto");
            f.classList.toggle("oculto", !abrir);
            document.getElementById(msg).classList.add("oculto");
            if (abrir) f.querySelector("input").focus();
        }

        function toggleRecuperacion(e) {
            e.preventDefault();
            alternarDesplegable("formRecuperacion", "msgRecuperacion");
        }

        // Mensaje dentro del desplegable: tipo ok | danger | info
        function mensaje(id, tipo, texto, html = false) {
            const m = document.getElementById(id);
            m.className = `ui-alerta ui-alerta--${tipo} mt-12`;
            if (html) m.innerHTML = texto; else m.textContent = texto;
        }

        // Autoservicio: la respuesta es la misma exista o no el usuario (el backend nunca
        // lo distingue, a propósito) — así que acá tampoco hay nada que ramificar por
        // status code, salvo un error de red/servidor real.
        async function enviarRecuperacion() {
            if (!YS.form.validar([{ id: "userRecuperacion", requerido: "Ingresá tu usuario." }])) return;
            const username = document.getElementById("userRecuperacion").value.trim();
            try {
                const res = await YS.fetch("/recuperacion-password", { method: "POST", json: { username }, sinRedireccion: true });
                const data = await res.json().catch(() => ({}));
                if (res.ok) mensaje("msgRecuperacion", "ok", data.mensaje || "Si el usuario existe, te llegó un mail con instrucciones.");
                else mensaje("msgRecuperacion", "danger", data.mensaje || "Error al enviar la solicitud.");
            } catch {
                mensaje("msgRecuperacion", "danger", "No se pudo conectar con el servidor.");
            }
        }
    </script>
</body>
</html>
