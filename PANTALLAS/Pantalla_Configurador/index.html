<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YoSoy - Panel Configurador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div class="contenedor-principal">

        <div class="card-login">

            <img src="../Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="Logo YoSoy" class="logo">

            <h1 class="titulo">YoSoy</h1>
            <p class="subtitulo">Panel Configurador</p>

            <form onsubmit="iniciarSesion(event)">

                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" class="input" placeholder="Ingrese su usuario" required>
                </div>

                <div class="campo">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" class="input" placeholder="Ingrese su contraseña" required>
                </div>

                <button type="submit" class="boton">Iniciar Sesión</button>

            </form>

        </div>

    </div>

    <script>
        function iniciarSesion(e) {
            e.preventDefault();
            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;

            if (usuario === "admin" && contrasena === "admin") {
                window.location.href = "dashboard.html";
            } else {
                alert("Usuario o contraseña incorrectos");
            }
        }
    </script>

</body>
</html>
