# ───────────────────────────────────────────────────────────────────────────
# coturn — configuración de TURN/STUN para YoSoy (videollamadas seguras)
#
# Reemplazá los PLACEHOLDERS antes de usar. NO commitear secretos reales.
# Arranque típico (Linux):  turnserver -c /etc/turnserver.conf
# ───────────────────────────────────────────────────────────────────────────

# Puertos de señalización TURN/STUN
listening-port=3478
tls-listening-port=5349

# IP pública del servidor (la que ve Internet). En casa con DDNS suele ser la WAN.
# Si la PC está detrás de NAT, dejá también la IP local con la sintaxis EXTERNAL/LOCAL.
external-ip=PLACEHOLDER_IP_PUBLICA
# external-ip=PLACEHOLDER_IP_PUBLICA/PLACEHOLDER_IP_LOCAL

# Realm = dominio del servicio.
realm=turn.comuna31.com.ar

# ─── Autenticación por secreto compartido (REST API / credenciales efímeras) ──
# DEBE ser idéntico a Turn:StaticAuthSecret del backend (.NET) / env Turn__StaticAuthSecret.
# El backend genera username "exp:idUsuario" y credential HMAC-SHA1(secret) con TTL corto.
use-auth-secret
static-auth-secret=PLACEHOLDER_TURN_STATIC_AUTH_SECRET

# ─── Rango UDP de relay ACOTADO (~40 puertos) ─────────────────────────────────
# Tiene que coincidir EXACTAMENTE con el rango UDP reenviado en el router.
min-port=49160
max-port=49200

# ─── TLS (turns:) ─────────────────────────────────────────────────────────────
# Rutas a los certificados del dominio del TURN. Pueden ser los emitidos por Caddy/Let's Encrypt.
cert=PLACEHOLDER_RUTA_FULLCHAIN_PEM
pkey=PLACEHOLDER_RUTA_PRIVKEY_PEM

# ─── Endurecimiento ─────────────────────────────────────────────────────────
fingerprint
no-cli
no-multicast-peers
# No permitir relay hacia direcciones privadas/loopback (anti-SSRF desde el relay).
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging
log-file=/var/log/turnserver/turn.log
simple-log
