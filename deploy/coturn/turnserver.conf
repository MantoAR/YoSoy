# coturn para YoSoy (relay TURN de las videollamadas). Va en /etc/turnserver.conf.
# Paso a paso: docs/DESPLIEGUE_VIDEO.md, paso d.
#
# ESTE ARCHIVO NO TIENE NINGÚN SECRETO. El secreto compartido con la API lo escribe
# deploy/video/generar-secretos.sh en el lugar marcado más abajo (static-auth-secret); no lo pegues a mano
# acá ni lo subas al repositorio.
#
# Instalarlo con dueño root:turnserver y permisos 640 (coturn corre como "turnserver" y tiene que poder
# leerlo; el resto del sistema, no, porque ahí queda el secreto):
#   sudo install -m 640 -o root -g turnserver deploy/coturn/turnserver.conf /etc/turnserver.conf
#
# Formato: una opción por línea, "opcion=valor" (o solo "opcion" si es una bandera). Los comentarios van
# en líneas propias, nunca al final de una opción (ahí podrían quedar como parte del valor).

# ============================ Autenticación ============================================================
# Credenciales efímeras ("TURN REST API"). La API de YoSoy arma el usuario "vencimientoUnix:idUsuario" y la
# contraseña Base64(HMAC-SHA1(secreto, usuario)); coturn las valida con ese mismo secreto, sin base de
# datos, y las rechaza pasado el vencimiento. Nadie sin una credencial vigente puede usar el relay.
use-auth-secret

# Reino (realm) de la autenticación: el dominio del sitio.
realm=yosoytelemedicina.tech

# Secreto compartido con la API (Video__TurnSecreto en /opt/yosoy/config/video.env).
# La línea static-auth-secret=... la escribe deploy/video/generar-secretos.sh justo debajo de la marca de
# abajo. Mientras no esté, coturn no tiene con qué validar ninguna credencial y rechaza todo (es más seguro
# que traer un valor por defecto). La marca se deja tal cual: el script la usa para saber dónde escribir.
# >>> static-auth-secret: lo escribe deploy/video/generar-secretos.sh debajo de esta línea <<<

# ============================ Puertos ==================================================================
# Puerto de STUN y TURN. coturn escucha en UDP y en TCP en este mismo número: los navegadores usan UDP y
# TCP queda de respaldo para redes que bloquean UDP (las URLs "?transport=tcp" de Video__Ice__TurnUrls).
# Se abre en UFW como 3478/udp y 3478/tcp.
listening-port=3478

# Rango de puertos UDP donde coturn abre los relays (uno por allocation). Son 41 puertos: alcanzan para unas
# 20 personas relayadas a la vez (cada una puede ocupar 2 mientras junta candidatos por UDP y por TCP). Si
# se queda corto, ampliar el rango y subir total-quota. Tiene que coincidir con la regla de UFW
# (49160:49200/udp) y con el firewall del proveedor.
min-port=49160
max-port=49200

# Sin TLS por ahora: no hay certificado para coturn, así que no se abren los puertos de TLS (5349) ni de
# DTLS. El contenido de la llamada va cifrado de punta a punta igual (DTLS-SRTP entre los navegadores; TURN
# solo retransmite paquetes ya cifrados). Lo que viaja sin cifrar hacia coturn es el pedido de relay: el
# usuario efímero (vencimiento e id de usuario) y las direcciones IP. TLS queda como mejora (ver el final
# de este archivo y docs/DESPLIEGUE_VIDEO.md).
no-tls
no-dtls

# ============================ Protocolo ================================================================
# Agrega un CRC (fingerprint) a los mensajes STUN/TURN. WebRTC lo espera.
fingerprint

# Solo relays UDP (RFC 5766). WebRTC nunca pide relays TCP (RFC 6062); apagarlos achica la superficie.
# (Esto no afecta a las URLs "?transport=tcp": ahí TCP es el transporte entre el navegador y coturn, y el
# relay hacia el otro navegador sigue siendo UDP.)
no-tcp-relay

# Apagan el descubrimiento de comportamiento de NAT (RFC 5780) y el modo STUN "viejo": agregan atributos
# a las respuestas de STUN y aumentan el factor de amplificación en ataques por reflexión. YoSoy no usa
# ninguno de los dos.
no-rfc5780
no-stun-backward-compatibility

# ============================ Superficie de ataque =====================================================
# Sin la consola de administración por telnet (127.0.0.1:5766). No hace falta y es una puerta más.
no-cli

# No retransmitir hacia direcciones multicast.
no-multicast-peers

# Hacia qué direcciones puede retransmitir un cliente ("peer"). Sin esto, cualquiera con una credencial
# válida podría pedirle a coturn que mande paquetes UDP a otras máquinas de la red interna del VPS, o a la
# propia máquina por 127.0.0.1 (la API en :5000, el signaling en :3001, SQL Server), usando a coturn de
# puente. Los peers legítimos son direcciones públicas: las de otros navegadores o las de los relays.
# Formato: "desde-hasta" (un rango por línea).
#
# OJO: NO se bloquea la IP pública de este mismo servidor. Cuando las dos personas de una llamada pasan por
# este coturn, cada una le manda a la dirección de relay de la otra, que es esta misma IP: bloquearla
# rompería justo ese caso.
#
# IPv4: "esta red" (0.0.0.0/8)
denied-peer-ip=0.0.0.0-0.255.255.255
# 10.0.0.0/8 (privada)
denied-peer-ip=10.0.0.0-10.255.255.255
# 100.64.0.0/10 (CGNAT, la que usan también las VPN tipo Tailscale)
denied-peer-ip=100.64.0.0-100.127.255.255
# 127.0.0.0/8 (loopback: los servicios de esta misma máquina)
denied-peer-ip=127.0.0.0-127.255.255.255
# 169.254.0.0/16 (link-local; incluye el servicio de metadatos de las nubes, 169.254.169.254)
denied-peer-ip=169.254.0.0-169.254.255.255
# 172.16.0.0/12 (privada)
denied-peer-ip=172.16.0.0-172.31.255.255
# 192.0.0.0/24 (reservada por la IETF)
denied-peer-ip=192.0.0.0-192.0.0.255
# 192.0.2.0/24, 198.51.100.0/24 y 203.0.113.0/24 (rangos de documentación)
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
# 192.88.99.0/24 (relays 6to4, obsoleto)
denied-peer-ip=192.88.99.0-192.88.99.255
# 192.168.0.0/16 (privada)
denied-peer-ip=192.168.0.0-192.168.255.255
# 198.18.0.0/15 (pruebas de rendimiento de redes)
denied-peer-ip=198.18.0.0-198.19.255.255
# 224.0.0.0/4 (multicast) y 240.0.0.0/4 (reservado, incluye el broadcast 255.255.255.255)
denied-peer-ip=224.0.0.0-255.255.255.255
#
# IPv6: loopback (::1)
denied-peer-ip=::1
# ::ffff:0:0/96 (IPv4 escrita como IPv6: cerraría el atajo de usar ::ffff:10.0.0.1 para esquivar las reglas de arriba)
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
# 100::/64 (descarte, RFC 6666)
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
# 2001:db8::/32 (documentación)
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
# fc00::/7 (ULA, las privadas de IPv6)
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# fe80::/10 (link-local)
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# ff00::/8 (multicast)
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ============================ Cuotas y ancho de banda ==================================================
# Puntos de partida razonables para una clínica chica; medir en las primeras llamadas reales y ajustar.
#
# Relays simultáneos por usuario (credencial). Un navegador abre 1 o 2 (UDP y TCP) y, al reiniciar ICE,
# puede tener hasta 4 a la vez: 8 deja margen y corta a quien intente quedarse con todo el rango. Ojo: con
# credenciales efímeras el usuario lleva el vencimiento, así que si coturn cuenta por nombre completo esto es
# un tope por credencial; el tope general es total-quota.
user-quota=8
# Relays simultáneos en total. Alineado con los 41 puertos del rango: al llegar, coturn contesta "sin
# capacidad" en vez de seguir aceptando gente. Si se amplía el rango, subir esto.
total-quota=40
# Ancho de banda máximo por sesión, en bytes por segundo (500000 = 4 Mbit/s): sobra para video HD
# (~2,5 Mbit/s) con audio. Lo que pase del tope se descarta. La entrada y la salida se cuentan por separado.
max-bps=500000
# Ancho de banda total de coturn, en bytes por segundo (10000000 = 80 Mbit/s, unas 20 sesiones a tope),
# también con la entrada y la salida por separado. Protege al VPS, y a su transferencia mensual, de un relay
# desbocado.
bps-capacity=10000000

# ============================ Logs =====================================================================
# Al journal de systemd (ver con `sudo journalctl -u coturn`). Sin "verbose": el nivel por defecto alcanza
# para ver cuándo arranca y las altas y bajas de sesiones (con el usuario efímero y las IP).
syslog

# ============================ Solo si el VPS está detrás de NAT ========================================
# Si la IP pública del servidor aparece en una interfaz (`ip -4 -br addr`), NO se necesita nada de esto.
# Si la interfaz tiene una IP privada (10.x, 172.16-31.x, 192.168.x), coturn tiene que anunciar la pública:
# descomentar y completar (las dos IP son de ESTE servidor). Además, como arriba se bloquean las privadas,
# hay que permitir la privada del propio servidor (permitir le gana a denegar); si no, dos personas que
# pasan por este mismo coturn no se pueden ver.
#external-ip=<IP_PUBLICA>/<IP_PRIVADA>
#allowed-peer-ip=<IP_PRIVADA>

# ============================ Mejora pendiente: TLS (turns:, puerto 5349) ==============================
# Sirve para redes que solo dejan pasar tráfico cifrado tipo HTTPS. Hace falta un certificado que coturn
# pueda leer (por ejemplo el de Let's Encrypt del dominio, copiado a un directorio que lea "turnserver" y
# renovado con la certificación), abrir 5349/tcp en UFW, sacar no-tls y no-dtls de arriba y descomentar:
#tls-listening-port=5349
#cert=/etc/coturn/certs/fullchain.pem
#pkey=/etc/coturn/certs/privkey.pem
#no-tlsv1
#no-tlsv1_1
# y sumar en video.env:  Video__Ice__TurnUrls__2=turns:yosoytelemedicina.tech:5349?transport=tcp
