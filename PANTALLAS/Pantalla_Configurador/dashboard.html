<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy · Panel configurador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../shared/tema.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <!-- La barra superior, el menú y el encabezado de página los arma shared/shell.js.
         Cada sección (mostrarTab) se dibuja en #contenido. -->
    <main class="ui-pagina">
        <div class="ui-contenido contenido" id="contenido"></div>
    </main>

    <!-- MODAL ACEPTAR DERIVACION -->
    <div class="modal-overlay" id="modalDerivOverlay" onclick="cerrarModalDeriv()"></div>
    <div class="modal-panel" id="modalDerivPanel">
        <div class="modal-header-custom">
            <span>Aceptar Solicitud de Cambio</span>
            <button class="btn-cerrar-modal" onclick="cerrarModalDeriv()">✕</button>
        </div>
        <div class="modal-body-custom" id="modalDerivBody"></div>
        <div class="modal-footer-custom">
            <button class="btn btn-secondary" onclick="cerrarModalDeriv()">Cancelar</button>
            <button class="btn btn-guardar" onclick="confirmarAceptarDeriv()">Confirmar</button>
        </div>
    </div>

    <!-- MODAL EDITAR REGISTRO -->
    <div class="modal-overlay" id="modalOverlay" onclick="cerrarModal()"></div>
    <div class="modal-panel" id="modalPanel">
        <div class="modal-header-custom">
            <span id="modalTitulo">Editar</span>
            <button class="btn-cerrar-modal" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body-custom" id="modalBody"></div>
        <div class="modal-footer-custom">
            <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-guardar" onclick="guardar()">Guardar cambios</button>
        </div>
    </div>

    <script src="../shared/ui.js"></script>
    <script src="../shared/shell.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
