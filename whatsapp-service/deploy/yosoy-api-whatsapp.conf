# Drop-in para que yosoy-api también lea /opt/yosoy/config/whatsapp.env, sin tocar su
# unit original ni su .env principal. Instalar como:
#   /etc/systemd/system/yosoy-api.service.d/whatsapp.conf
# seguido de: sudo systemctl daemon-reload && sudo systemctl restart yosoy-api
[Service]
EnvironmentFile=/opt/yosoy/config/whatsapp.env
