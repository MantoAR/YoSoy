<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy - Dashboard Configurador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center gap-3">
                <img src="../Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="Logo" class="logo-nav">
                <span class="navbar-brand mb-0">YoSoy <span class="badge-panel">Panel Configurador</span></span>
            </div>
            <button class="btn btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
        </div>
    </nav>

    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="grupo">
                <div class="grupo-titulo" onclick="toggleGrupo('cuentas')">
                    <span>👤 Cuentas</span>
                    <span class="flecha" id="flecha-cuentas">▼</span>
                </div>
                <ul class="grupo-items" id="grupo-cuentas">
                    <li onclick="mostrarTab('usuarios')">Usuarios</li>
                    <li onclick="mostrarTab('pacientes')">Pacientes</li>
                    <li onclick="mostrarTab('profesionales')">Profesionales</li>
                    <li onclick="mostrarTab('tutores')">Tutores</li>
                </ul>
            </div>

            <div class="grupo">
                <div class="grupo-titulo" onclick="toggleGrupo('clinico')">
                    <span>🩺 Clínico</span>
                    <span class="flecha" id="flecha-clinico">▶</span>
                </div>
                <ul class="grupo-items oculto" id="grupo-clinico">
                    <li onclick="mostrarTab('turnos')">Turnos</li>
                    <li onclick="mostrarTab('agendas')">Agenda</li>
                    <li onclick="mostrarTab('derivaciones')">Derivaciones</li>
                    <li onclick="mostrarTab('evoluciones')">Evoluciones</li>
                    <li onclick="mostrarTab('eventoscrisis')">Eventos de Crisis</li>
                </ul>
            </div>

            <div class="grupo">
                <div class="grupo-titulo" onclick="toggleGrupo('sistema')">
                    <span>⚙️ Sistema</span>
                    <span class="flecha" id="flecha-sistema">▶</span>
                </div>
                <ul class="grupo-items oculto" id="grupo-sistema">
                    <li onclick="mostrarTab('roles')">Roles</li>
                    <li onclick="mostrarTab('especialidades')">Especialidades</li>
                    <li onclick="mostrarTab('coberturas')">Coberturas</li>
                    <li onclick="mostrarTab('interaccionesia')">Interacciones IA</li>
                </ul>
            </div>

        </aside>

        <!-- CONTENIDO -->
        <main class="contenido" id="contenido">
            <div class="bienvenida">
                <p>Seleccioná una sección del menú</p>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
