<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy - Telemedicina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f5ff, #ddd0f5, #c0a8ee);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-login {
            background: white;
            border-radius: 24px;
            padding: 40px 36px;
            width: 420px;
            box-shadow: 0 12px 40px rgba(100, 80, 180, 0.18);
            text-align: center;
        }

        .logo {
            width: 110px;
            margin-bottom: 12px;
        }

        .titulo {
            font-size: 36px;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 2px;
        }

        .subtitulo {
            font-size: 13px;
            color: #9D6BCF;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        /* TABS DE ROL */
        .roles {
            display: flex;
            border: 2px solid #e0d4f5;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .rol-btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
            border-right: 2px solid #e0d4f5;
        }

        .rol-btn:last-child { border-right: none; }

        .rol-btn .icono { font-size: 22px; }

        .rol-btn.activo {
            background: linear-gradient(to bottom, #0d6efd, #6A5ACD);
            color: white;
        }

        .rol-btn:not(.activo):hover {
            background: #f0eaff;
            color: #6A5ACD;
        }

        /* CAMPOS */
        .campo {
            text-align: left;
            margin-bottom: 16px;
            position: relative;
        }

        .campo label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #6A5ACD;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .input {
            width: 100%;
            height: 46px;
            border: 2px solid #e0d4f5;
            border-radius: 12px;
            padding: 0 40px 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .input:focus { border-color: #6A5ACD; }

        .ojo {
            position: absolute;
            right: 13px;
            bottom: 12px;
            cursor: pointer;
            font-size: 18px;
            color: #aaa;
            user-select: none;
        }

        .ojo:hover { color: #6A5ACD; }

        /* BOTON */
        .boton {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, #0d6efd, #6A5ACD);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
        }

        .boton:hover {
            opacity: 0.88;
            transform: scale(1.02);
        }

        .link-registro {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            color: #999;
        }

        .link-registro a {
            color: #6A5ACD;
            font-weight: bold;
            text-decoration: none;
        }

        .link-registro a:hover { text-decoration: underline; }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card-login">

        <img src="Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="Logo YoSoy" class="logo">
        <div class="titulo">YoSoy</div>
        <div class="subtitulo">Telemedicina en Salud Mental</div>

        <!-- TABS DE ROL -->
        <div class="roles">
            <button class="rol-btn activo" id="tab-paciente" onclick="seleccionarRol('paciente')">
                <span class="icono">🧑</span>
                Paciente
            </button>
            <button class="rol-btn" id="tab-profesional" onclick="seleccionarRol('profesional')">
                <span class="icono">👨‍⚕️</span>
                Profesional
            </button>
            <button class="rol-btn" id="tab-configurador" onclick="seleccionarRol('configurador')">
                <span class="icono">⚙️</span>
                Configurador
            </button>
        </div>

        <!-- FORMULARIO -->
        <form onsubmit="iniciarSesion(event)">

            <div class="campo">
                <label>Usuario</label>
                <input type="text" id="usuario" class="input" placeholder="Ingrese su usuario" required>
            </div>

            <div class="campo">
                <label>Contraseña</label>
                <input type="password" id="contrasena" class="input" placeholder="Ingrese su contraseña" required>
                <span class="ojo" onclick="togglePassword()">👁️</span>
            </div>

            <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos.</div>

            <button type="submit" class="boton">Ingresar</button>

        </form>

        <span class="link-registro" id="linkRegistro">
            ¿No tenés cuenta? <a href="Pantalla_Usuario/Usuario/consentimiento_crear_cuenta.html">Registrate</a>
        </span>

    </div>

    <script>
        let rolActual = "paciente";

        function seleccionarRol(rol) {
            rolActual = rol;
            document.querySelectorAll(".rol-btn").forEach(b => b.classList.remove("activo"));
            document.getElementById(`tab-${rol}`).classList.add("activo");
            document.getElementById("errorMsg").style.display = "none";

            // Solo paciente puede registrarse
            document.getElementById("linkRegistro").style.display =
                rol === "paciente" ? "block" : "none";
        }

        function togglePassword() {
            const input = document.getElementById("contrasena");
            input.type = input.type === "password" ? "text" : "password";
        }

        function iniciarSesion(e) {
            e.preventDefault();
            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;

            // Login temporal hardcodeado por rol
            const credenciales = {
                paciente:      { user: "paciente",      pass: "123456" },
                profesional:   { user: "profesional",   pass: "123456" },
                configurador:  { user: "admin",          pass: "admin"  },
            };

            const cred = credenciales[rolActual];
            if (usuario === cred.user && contrasena === cred.pass) {
                if (rolActual === "configurador") {
                    window.location.href = "Pantalla_Configurador/dashboard.html";
                } else {
                    alert(`Bienvenido, ${rolActual}. Panel en construcción.`);
                }
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }
    </script>

</body>
</html>
