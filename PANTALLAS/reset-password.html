<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/pantallas/shared/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/pantallas/shared/favicon/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/pantallas/shared/favicon/favicon-16.png">
    <link rel="apple-touch-icon" href="/pantallas/shared/favicon/favicon-180.png">
    <link rel="apple-touch-icon" href="/pantallas/shared/favicon/favicon-180.png">
    <title>YoSoy · Restablecer contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/pantallas/shared/tema.css">
    <link rel="stylesheet" href="/pantallas/shared/acceso.css">
</head>
<body class="acceso">
<!-- Se llega desde el mail de recuperación (?token=...). El token vence a los 30 minutos
     y sirve una sola vez — ver POST /recuperacion-password/reset en Program.cs. -->
<main class="acceso-tarjeta" aria-labelledby="tituloReset">
    <a class="acceso-marca" href="/pantallas/index.html" aria-label="YoSoy, ir al ingreso">
        <img src="/pantallas/Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="">
        <span class="ui-marca-nombre">Yo<b>Soy</b></span>
    </a>
    <h1 class="acceso-titulo" id="tituloReset">Restablecer contraseña</h1>
    <p class="acceso-bajada">Elegí una contraseña nueva para tu cuenta.</p>

    <form id="formSection" class="acceso-form" onsubmit="event.preventDefault(); resetear()" novalidate>
        <div class="ui-campo">
            <label for="pass1">Nueva contraseña</label>
            <div class="campo-clave">
                <input type="password" id="pass1" class="ui-input" placeholder="Al menos 6 caracteres" autocomplete="new-password">
                <button type="button" class="ver-clave" onclick="togglePass('pass1', this)" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
        </div>
        <div class="ui-campo">
            <label for="pass2">Confirmar contraseña</label>
            <div class="campo-clave">
                <input type="password" id="pass2" class="ui-input" placeholder="Repetí tu nueva contraseña" autocomplete="new-password">
                <button type="button" class="ver-clave" onclick="togglePass('pass2', this)" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
        </div>
        <button type="submit" class="ui-btn ui-btn--primary ui-btn--lg ui-btn--bloque" id="btnGuardar">Guardar contraseña</button>
    </form>
    <div id="mensaje" class="ui-alerta mt-12 oculto" role="status"></div>

    <p class="acceso-pie"><a href="/pantallas/index.html">Volver al inicio de sesión</a></p>
</main>

<script src="/pantallas/shared/ui.js"></script>
<script>
    function togglePass(id, boton) {
        const inp = document.getElementById(id);
        const mostrar = inp.type === "password";
        inp.type = mostrar ? "text" : "password";
        boton.setAttribute("aria-pressed", mostrar);
        boton.setAttribute("aria-label", mostrar ? "Ocultar contraseña" : "Mostrar contraseña");
    }

    function mostrar(tipo, texto) {
        const m = document.getElementById("mensaje");
        m.className = `ui-alerta ui-alerta--${tipo} mt-12`;
        m.textContent = texto;
    }

    async function resetear() {
        const token = YS.param("token");
        if (!token) { mostrar("danger", "Link inválido."); return; }
        if (!YS.form.validar([
            { id: "pass1", requerido: "Ingresá una contraseña.", minimo: 6, mensajeMinimo: "La contraseña debe tener al menos 6 caracteres." },
            { id: "pass2", requerido: "Repetí la contraseña.",
              validar: v => v !== document.getElementById("pass1").value ? "Las contraseñas no coinciden." : null }
        ])) return;

        const btn = document.getElementById("btnGuardar");
        btn.classList.add("cargando");
        try {
            const res = await YS.fetch("/recuperacion-password/reset", {
                method: "POST", json: { token, nuevaPassword: document.getElementById("pass1").value }, sinRedireccion: true
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                mostrar("ok", data.mensaje || "Listo, tu contraseña quedó guardada.");
                document.getElementById("formSection").classList.add("oculto");
            } else {
                mostrar("danger", data.mensaje ?? YS.mensajeHttp(res.status));
            }
        } catch {
            mostrar("danger", "No se pudo conectar con el servidor.");
        } finally {
            btn.classList.remove("cargando");
        }
    }
</script>
</body>
</html>
