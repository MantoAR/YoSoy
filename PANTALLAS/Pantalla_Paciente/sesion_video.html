<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Sesión - YoSoy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f3; margin: 0; padding: 16px; }
        .card { background: white; border-radius: 12px; padding: 20px; border: 1px solid #eee; margin-bottom: 12px; }
        .card h3 { font-size: 12px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing:.05em; margin-bottom: 12px; }
        .videos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        @media (max-width: 640px) { .videos-grid { grid-template-columns: 1fr; } }
        .video-wrap { position: relative; background: #111; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; }
        .video-wrap video { width: 100%; height: 100%; object-fit: contain; display: block; }
        .video-label { position: absolute; bottom: 8px; left: 10px; background: rgba(0,0,0,0.6); color: white; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
        .btn-rojo { background: #A32D2D; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .btn-verde { background: #185FA5; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn-verde:disabled { opacity: 0.5; cursor: default; }
        .estado { font-size: 13px; color: #888; margin-left: 10px; }
        .controles { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .codigo-input { display: flex; gap: 8px; margin-top: 12px; }
        .codigo-input input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0d4f5;
            border-radius: 10px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            color: #185FA5;
            outline: none;
        }
        .codigo-input input:focus { border-color: #185FA5; }
        .estado-box { margin-top: 12px; font-size: 13px; color: #888; }
        .estado-box.conectado { color: #3B6D11; font-weight: 500; }
        .estado-box.error { color: #A32D2D; }
    </style>
</head>
<body>

    <!-- PANTALLA DE ESPERA -->
    <div id="pantalla-espera">
        <div class="card">
            <h3>Unirse a sesión</h3>
            <p style="font-size:13px;color:#666;">
                Te estamos conectando con tu profesional para la videollamada.
            </p>
            <div class="estado-box" id="estado-espera">Conectando a tu sesión…</div>
            <div class="controles" id="acciones-espera" style="display:none">
                <button class="btn-verde" id="btn-reintentar" onclick="iniciar()">Reintentar</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE SESIÓN -->
    <div id="pantalla-sesion" style="display:none">
        <div class="videos-grid">
            <div class="video-wrap">
                <video id="vid-profesional" autoplay playsinline></video>
                <span class="video-label">Tu profesional</span>
            </div>
            <div class="video-wrap">
                <video id="vid-paciente" autoplay playsinline muted></video>
                <span class="video-label">Vos</span>
            </div>
        </div>
        <div class="controles">
            <button class="btn-rojo" onclick="finalizarSesion()">⏹ Salir de la sesión</button>
            <span class="estado" id="estado-txt">Conectando...</span>
            <span class="estado" id="cuenta"></span>
        </div>
    </div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const linkToken = params.get('link');
const API = (location.protocol.startsWith('http') && location.port !== '5500')
    ? location.origin
    : 'http://localhost:5000';

let cfg = null, sesion = null, pc = null, stream = null, socket = null;
let countdownTimer = null, finProgramado = null;
let audioRemoto = null;

const $ = id => document.getElementById(id);
const estado = msg => { $('estado-txt').textContent = msg; };

function mostrarEspera(msg, clase) {
    $('pantalla-espera').style.display = 'block';
    $('pantalla-sesion').style.display = 'none';
    const box = $('estado-espera');
    box.textContent = msg;
    box.className = 'estado-box' + (clase ? ' ' + clase : '');
    $('acciones-espera').style.display = clase === 'error' ? 'flex' : 'none';
}

async function cargarConfig() {
    try { return await (await fetch(`${API}/config`)).json(); }
    catch { return null; }
}

function combinar(fecha, hora) {
    if (!fecha) return null;
    const d = new Date(fecha);
    if (isNaN(d.getTime())) return null;
    if (typeof hora === 'string') {
        const [hh, mm, ss] = hora.split(':').map(Number);
        d.setHours(hh || 0, mm || 0, ss || 0, 0);
    }
    return d.getTime();
}

// Prioriza la sesión actualmente activa; si no hay, el próximo dentro del margen.
// El backend igual re-verifica la asignación en /join: esto solo elige el turno.
async function elegirTurno(url) {
    let turnos;
    try { turnos = await (await fetch(url)).json(); } catch { return null; }
    if (!Array.isArray(turnos)) return null;
    const ahora = Date.now();
    const margen = (cfg.margenIngresoMinutos || 5) * 60000;
    const durDef = cfg.duracionTurnoDefault || 60;
    const candidatos = [];
    for (const t of turnos) {
        if (t.idEstadoTurno === 3) continue;
        const inicio = combinar(t.fecha, t.hora);
        if (inicio === null) continue;
        const fin = inicio + (t.duracionMinutos || durDef) * 60000;
        if (ahora >= inicio - margen && ahora <= fin)
            candidatos.push({ id: t.idTurno, inicio, activa: ahora >= inicio && ahora <= fin });
    }
    if (!candidatos.length) return null;
    candidatos.sort((a, b) => (b.activa - a.activa) || (Math.abs(ahora - a.inicio) - Math.abs(ahora - b.inicio)));
    return candidatos[0].id;
}

async function procesarRespuestaJoin(r) {
    if (r.status === 429) { mostrarEspera('Demasiados intentos. Esperá unos minutos.', 'error'); return null; }
    if (r.status === 401) { mostrarEspera('Tu acceso no es válido. Iniciá sesión nuevamente.', 'error'); return null; }
    if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        mostrarEspera(d.mensaje || 'No se pudo abrir la sesión.', 'error');
        return null;
    }
    return r.json();
}

async function joinPorSistema() {
    const token = localStorage.getItem('token');
    const idPaciente = localStorage.getItem('idPaciente');
    if (!token || !idPaciente) {
        mostrarEspera('Iniciá sesión nuevamente para entrar a la videollamada.', 'error');
        return null;
    }
    const idTurno = await elegirTurno(`${API}/pacientes/${idPaciente}/turnos`);
    if (!idTurno) {
        mostrarEspera('No encontramos un turno activo ahora. Entrá a la hora de tu sesión.', 'error');
        return null;
    }
    const r = await fetch(`${API}/sesiones/turno/${idTurno}/join`, {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + token }
    });
    return procesarRespuestaJoin(r);
}

async function iniciar() {
    mostrarEspera('Conectando a tu sesión…');
    cfg = await cargarConfig();
    if (!cfg) return mostrarEspera('No se pudo conectar con el servidor.', 'error');

    let data;
    if (linkToken) {
        const r = await fetch(`${API}/sesiones/canjear-link`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: linkToken })
        });
        data = await procesarRespuestaJoin(r);
    } else {
        data = await joinPorSistema();
    }
    if (data) iniciarSesion(data);
}

function armarIceServers(data) {
    const servers = [];
    if (Array.isArray(data.iceServers)) {
        for (const s of data.iceServers) {
            if (!s || !s.urls) continue;
            servers.push(s.username ? { urls: s.urls, username: s.username, credential: s.credential } : { urls: s.urls });
        }
    }
    const stun = (Array.isArray(cfg.stun) && cfg.stun.length)
        ? cfg.stun
        : ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'];
    servers.push({ urls: stun });
    const hayTurn = servers.some(s => (Array.isArray(s.urls) ? s.urls : [s.urls]).some(u => String(u).startsWith('turn:') || String(u).startsWith('turns:')));
    if (!hayTurn) console.warn('TURN no disponible: la videollamada usa solo STUN de Google. Puede fallar entre redes distintas.');
    return servers;
}

async function iniciarSesion(data) {
    sesion = data;
    finProgramado = data.finProgramado;

    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch {
        mostrarEspera('No se pudo acceder a la cámara o micrófono.', 'error');
        return;
    }

    $('pantalla-espera').style.display = 'none';
    $('pantalla-sesion').style.display = 'block';
    $('vid-paciente').srcObject = stream;
    estado('Esperando a que se una tu profesional…');

    pc = new RTCPeerConnection({ iceServers: armarIceServers(data) });
    stream.getTracks().forEach(t => pc.addTrack(t, stream));

    pc.ontrack = e => {
        $('vid-profesional').srcObject = e.streams[0];
        estado('🟢 Sesión en curso');
        engancharAudioRemoto(e.streams[0]);
    };
    pc.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', { roomId: sesion.roomId, candidate: e.candidate });
    };

    socket = io(cfg.signalingUrl || API, { auth: { token: sesion.token } });
    socket.on('connect', () => socket.emit('join-room', { roomId: sesion.roomId }));
    socket.on('joined', () => enviarOferta());
    socket.on('user-joined', () => { estado('🟢 Sesión en curso'); enviarOferta(true); });
    socket.on('answer', async ({ answer }) => { await pc.setRemoteDescription(answer); });
    socket.on('ice-candidate', async ({ candidate }) => { try { await pc.addIceCandidate(candidate); } catch {} });
    socket.on('user-left', () => estado('⚠ El profesional se desconectó.'));
    socket.on('sesion-actualizada', refrescarToken);
    socket.on('rechazado', ({ motivo }) => mostrarEspera(motivo || 'No se pudo unir a la sesión.', 'error'));
    socket.on('connect_error', () => mostrarEspera('No se pudo conectar al servicio de videollamada.', 'error'));

    iniciarCuentaRegresiva();
}

async function enviarOferta(iceRestart = false) {
    const offer = await pc.createOffer(iceRestart ? { iceRestart: true } : {});
    await pc.setLocalDescription(offer);
    socket.emit('offer', { roomId: sesion.roomId, offer });
}

// ─── Cuenta regresiva según finProgramado ─────────────────────────────────────
function iniciarCuentaRegresiva() {
    clearInterval(countdownTimer);
    actualizarCuenta();
    countdownTimer = setInterval(actualizarCuenta, 1000);
}
function actualizarCuenta() {
    if (!finProgramado) { $('cuenta').textContent = ''; return; }
    const restante = new Date(finProgramado).getTime() - Date.now();
    if (restante <= 0) {
        clearInterval(countdownTimer);
        $('cuenta').textContent = '';
        estado('La sesión finalizó.');
        return;
    }
    const m = String(Math.floor(restante / 60000)).padStart(2, '0');
    const s = String(Math.floor((restante % 60000) / 1000)).padStart(2, '0');
    $('cuenta').textContent = `⏳ ${m}:${s}`;
}

// El profesional prolongó la sesión: pedimos token nuevo y reiniciamos la cuenta.
async function refrescarToken() {
    try {
        const r = await fetch(`${API}/sesiones/${sesion.idSesion}/refrescar-token`, {
            method: 'POST', headers: { 'Authorization': 'Bearer ' + sesion.token }
        });
        if (!r.ok) return;
        const d = await r.json();
        sesion.token = d.token;
        finProgramado = d.finProgramado;
        iniciarCuentaRegresiva();
    } catch {}
}

// ─── Enganche de audio remoto para Fase 2 (transcripción / análisis con LLM) ───
// TODO Fase 2: derivar este stream de audio a transcripción. Por ahora solo se deja
// accesible en `audioRemoto`; NO se transcribe ni se envía nada todavía.
function engancharAudioRemoto(remoto) {
    if (!remoto || !remoto.getAudioTracks().length) return;
    audioRemoto = remoto;
}

function finalizarSesion() {
    clearInterval(countdownTimer);
    stream?.getTracks().forEach(t => t.stop());
    pc?.close();
    socket?.disconnect();
    $('pantalla-sesion').style.display = 'none';
    mostrarEspera('Saliste de la sesión.', 'conectado');
    $('acciones-espera').style.display = 'flex';
}

iniciar();
</script>
</body>
</html>
