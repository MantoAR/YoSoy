<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy - Telemedicina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="shared/tema.css">
    <style>
        /* Login. Colores, tipografía y componentes base: shared/tema.css */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: var(--bg); font-family: var(--font); color: var(--text);
        }
        .card-login {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
            box-shadow: var(--shadow-md); padding: 32px 32px 28px; width: 400px; text-align: center;
        }
        .logo { width: 48px; height: 48px; object-fit: contain; margin-bottom: 10px; background: var(--accent); border-radius: var(--r-lg); padding: 7px; }
        .titulo { font-size: var(--fs-2xl); font-weight: 600; color: var(--text); margin-bottom: 2px; }
        .subtitulo { font-size: var(--fs-md); color: var(--text-3); margin-bottom: 22px; }

        /* Selector de rol */
        .roles {
            display: flex; gap: 2px; padding: 2px; margin-bottom: 20px;
            background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md);
        }
        .rol-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
            height: 32px; border: none; border-radius: var(--r-sm); background: transparent;
            color: var(--text-3); font-family: var(--font); font-size: var(--fs-md); font-weight: 500; cursor: pointer;
        }
        .rol-btn .icono { display: inline-flex; }
        .rol-btn .icono svg { width: 15px; height: 15px; }
        .rol-btn.activo { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
        .rol-btn:not(.activo):hover { color: var(--text); }

        /* Campos */
        .campo { text-align: left; margin-bottom: 14px; position: relative; }
        .campo label { display: block; font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); margin-bottom: 5px; }
        .input {
            width: 100%; height: 38px; padding: 0 38px 0 12px;
            font-family: var(--font); font-size: var(--fs-lg); color: var(--text);
            background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); outline: none;
            transition: border-color .12s, box-shadow .12s, background .12s;
        }
        .input:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
        .ojo { position: absolute; right: 11px; bottom: 9px; cursor: pointer; color: var(--text-4); user-select: none; line-height: 0; }
        .ojo svg { width: 18px; height: 18px; }
        .ojo:hover { color: var(--text-2); }

        /* Botón */
        .boton {
            width: 100%; height: 38px; margin-top: 6px;
            border: 1px solid var(--accent); border-radius: var(--r-md); background: var(--accent); color: #fff;
            font-family: var(--font); font-size: var(--fs-lg); font-weight: 500; cursor: pointer;
        }
        .boton:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .boton--chico { height: 34px; font-size: var(--fs-md); }

        .link-registro { display: block; margin-top: 14px; font-size: var(--fs-md); color: var(--text-3); }
        .link-registro a { color: var(--accent); font-weight: 500; text-decoration: none; }
        .link-registro a:hover { text-decoration: underline; }

        .error-msg { color: var(--danger); font-size: var(--fs-md); margin-top: 8px; display: none; }
        .seccion-recuperacion { margin-top: 12px; }
        .form-desplegable { margin-top: 12px; }
        .mensaje-form { margin-top: 8px; font-size: var(--fs-md); }
    </style>
</head>
<body>

    <div class="card-login">

        <img src="Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="Logo YoSoy" class="logo">
        <div class="titulo">YoSoy</div>
        <div class="subtitulo">Telemedicina en Salud Mental</div>

        <!-- TABS DE ROL -->
        <div class="roles">
            <button class="rol-btn activo" id="tab-paciente" onclick="seleccionarRol('paciente')">
                <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"/></svg></span>
                Paciente
            </button>
            <button class="rol-btn" id="tab-profesional" onclick="seleccionarRol('profesional')">
                <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v6a6 6 0 0 0 12 0V3M12 15v2a4 4 0 0 0 8 0v-3"/><circle cx="20" cy="12" r="2"/></svg></span>
                Profesional
            </button>
            <button class="rol-btn" id="tab-configurador" onclick="seleccionarRol('configurador')">
                <span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
                Configurador
            </button>
        </div>

        <!-- FORMULARIO -->
        <form onsubmit="iniciarSesion(event)">

            <div class="campo">
                <label>Usuario</label>
                <input type="text" id="usuario" class="input" placeholder="Ingrese su usuario" required>
            </div>

            <div class="campo">
                <label>Contraseña</label>
                <input type="password" id="contrasena" class="input" placeholder="Ingrese su contraseña" required>
                <span class="ojo" id="btnOjo" onclick="togglePassword()">
                    <svg id="iconoOjoAbierto" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg id="iconoOjoCerrado" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </span>
            </div>

            <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos.</div>

            <button type="submit" class="boton">Ingresar</button>

        </form>

        <span class="link-registro" id="linkRegistro">
            ¿No tenés cuenta? <a href="Pantalla_Usuario/Usuario/consentimiento crear_cuenta.html">Registrate</a>
        </span>
        <span class="link-registro" id="linkRegistroProfesional" style="display:none">
            ¿Sos profesional? <a href="Pantalla_Usuario/Usuario/registro_profesional.html">Registrate acá</a>
        </span>

        <!-- RECUPERACIÓN DE CONTRASEÑA (solo paciente/profesional) -->
        <div id="seccionRecuperacion" class="seccion-recuperacion">
            <span class="link-registro">
                <a href="#" onclick="toggleRecuperacion(event)">¿Olvidé mi contraseña?</a>
                &nbsp;·&nbsp;
                <a href="#" onclick="toggleConsultarSolicitud(event)">Consultar solicitud</a>
            </span>

            <div id="formRecuperacion" class="form-desplegable" style="display:none">
                <div class="campo">
                    <label>Usuario</label>
                    <input type="text" id="userRecuperacion" class="input" placeholder="Tu nombre de usuario">
                </div>
                <button type="button" class="boton boton--chico" onclick="enviarRecuperacion()">
                    Enviar solicitud
                </button>
                <div id="msgRecuperacion" class="mensaje-form"></div>
            </div>

            <div id="formConsultarSolicitud" class="form-desplegable" style="display:none">
                <div class="campo">
                    <label>Usuario</label>
                    <input type="text" id="userConsulta" class="input" placeholder="Tu nombre de usuario">
                </div>
                <button type="button" class="boton boton--chico" onclick="consultarSolicitud()">
                    Consultar
                </button>
                <div id="msgConsulta" class="mensaje-form"></div>
            </div>
        </div>

    </div>

    <script>
        let rolActual = "paciente";

        function seleccionarRol(rol) {
            rolActual = rol;
            document.querySelectorAll(".rol-btn").forEach(b => b.classList.remove("activo"));
            document.getElementById(`tab-${rol}`).classList.add("activo");
            document.getElementById("errorMsg").style.display = "none";

            document.getElementById("linkRegistro").style.display =
                rol === "paciente" ? "block" : "none";
            document.getElementById("linkRegistroProfesional").style.display =
                rol === "profesional" ? "block" : "none";

            const esUserFinal = rol === "paciente" || rol === "profesional";
            document.getElementById("seccionRecuperacion").style.display = esUserFinal ? "block" : "none";
            if (!esUserFinal) {
                document.getElementById("formRecuperacion").style.display = "none";
                document.getElementById("formConsultarSolicitud").style.display = "none";
            }
        }

        function togglePassword() {
            const input = document.getElementById("contrasena");
            const mostrar = input.type === "password";
            input.type = mostrar ? "text" : "password";
            document.getElementById("iconoOjoAbierto").style.display = mostrar ? "none" : "";
            document.getElementById("iconoOjoCerrado").style.display = mostrar ? "" : "none";
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.style.display = "none";

            try {
                const res = await fetch("http://localhost:5000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: usuario, password: contrasena })
                });

                if (res.status === 423) {
                    const data = await res.json().catch(() => ({}));
                    errorMsg.textContent = data.mensaje ?? "Cuenta bloqueada temporalmente. Intentá en 15 minutos.";
                    errorMsg.style.display = "block";
                    return;
                }

                if (!res.ok) {
                    errorMsg.textContent = "Usuario o contraseña incorrectos.";
                    errorMsg.style.display = "block";
                    return;
                }

                const data = await res.json();

                if (data.rol !== rolActual) {
                    errorMsg.textContent = "Rol incorrecto para este usuario.";
                    errorMsg.style.display = "block";
                    return;
                }

                localStorage.setItem("idUsuario", data.idUsuario);
                localStorage.setItem("rol", data.rol);

                if (data.rol === "paciente") {
                    localStorage.setItem("idPaciente", data.idPaciente);
                    window.location.href = "Pantalla_Paciente/dashboard.html";
                } else if (data.rol === "profesional") {
                    localStorage.setItem("idProfesional", data.idProfesional);
                    window.location.href = "Pantalla_Profesional/nuevo_dashboard.html";
                } else {
                    window.location.href = "Pantalla_Configurador/dashboard.html";
                }

            } catch {
                errorMsg.textContent = "No se pudo conectar con el servidor.";
                errorMsg.style.display = "block";
            }
        }

        function toggleRecuperacion(e) {
            e.preventDefault();
            const f = document.getElementById("formRecuperacion");
            const visible = f.style.display !== "none";
            f.style.display = visible ? "none" : "block";
            document.getElementById("formConsultarSolicitud").style.display = "none";
            document.getElementById("msgRecuperacion").textContent = "";
        }

        function toggleConsultarSolicitud(e) {
            e.preventDefault();
            const f = document.getElementById("formConsultarSolicitud");
            const visible = f.style.display !== "none";
            f.style.display = visible ? "none" : "block";
            document.getElementById("formRecuperacion").style.display = "none";
            document.getElementById("msgConsulta").textContent = "";
        }

        async function enviarRecuperacion() {
            const username = document.getElementById("userRecuperacion").value.trim();
            const msg = document.getElementById("msgRecuperacion");
            if (!username) { msg.textContent = "Ingresá tu usuario."; msg.style.color = "#e74c3c"; return; }
            try {
                const res = await fetch("http://localhost:5000/recuperacion-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username })
                });
                if (res.ok) {
                    msg.style.color = "#27ae60";
                    msg.textContent = "Solicitud enviada. El administrador la revisará.";
                } else if (res.status === 409) {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "Ya tenés una solicitud pendiente.";
                } else if (res.status === 404) {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "Usuario no encontrado.";
                } else {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "Error al enviar la solicitud.";
                }
            } catch {
                msg.style.color = "#e74c3c";
                msg.textContent = "No se pudo conectar con el servidor.";
            }
        }

        async function consultarSolicitud() {
            const username = document.getElementById("userConsulta").value.trim();
            const msg = document.getElementById("msgConsulta");
            if (!username) { msg.textContent = "Ingresá tu usuario."; msg.style.color = "#e74c3c"; return; }
            try {
                const res = await fetch(`http://localhost:5000/recuperacion-password/estado/${encodeURIComponent(username)}`);
                if (res.status === 404) {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "No hay solicitudes para este usuario.";
                    return;
                }
                const data = await res.json();
                if (data.estado === "Pendiente") {
                    msg.style.color = "#888";
                    msg.textContent = "Tu solicitud está siendo revisada por el administrador.";
                } else if (data.estado === "Aceptada") {
                    msg.style.color = "#27ae60";
                    msg.innerHTML = `Tu nueva contraseña temporal es: <strong>${data.passwordTemporal}</strong>. Ingresá con ella y cambiala cuanto antes.`;
                } else if (data.estado === "Rechazada") {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "Tu solicitud fue rechazada. Contactá al administrador.";
                }
            } catch {
                msg.style.color = "#e74c3c";
                msg.textContent = "No se pudo conectar con el servidor.";
            }
        }
    </script>

</body>
</html>
