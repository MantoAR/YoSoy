<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy - Telemedicina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f5ff, #ddd0f5, #c0a8ee);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-login {
            background: white;
            border-radius: 24px;
            padding: 40px 36px;
            width: 420px;
            box-shadow: 0 12px 40px rgba(100, 80, 180, 0.18);
            text-align: center;
        }

        .logo {
            width: 110px;
            margin-bottom: 12px;
        }

        .titulo {
            font-size: 36px;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 2px;
        }

        .subtitulo {
            font-size: 13px;
            color: #9D6BCF;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        /* TABS DE ROL */
        .roles {
            display: flex;
            border: 2px solid #e0d4f5;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .rol-btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
            border-right: 2px solid #e0d4f5;
        }

        .rol-btn:last-child { border-right: none; }

        .rol-btn .icono { font-size: 22px; }

        .rol-btn.activo {
            background: linear-gradient(to bottom, #0d6efd, #6A5ACD);
            color: white;
        }

        .rol-btn:not(.activo):hover {
            background: #f0eaff;
            color: #6A5ACD;
        }

        /* CAMPOS */
        .campo {
            text-align: left;
            margin-bottom: 16px;
            position: relative;
        }

        .campo label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #6A5ACD;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .input {
            width: 100%;
            height: 46px;
            border: 2px solid #e0d4f5;
            border-radius: 12px;
            padding: 0 40px 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .input:focus { border-color: #6A5ACD; }

        .ojo {
            position: absolute;
            right: 13px;
            bottom: 12px;
            cursor: pointer;
            font-size: 18px;
            color: #aaa;
            user-select: none;
        }

        .ojo:hover { color: #6A5ACD; }

        /* BOTON */
        .boton {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, #0d6efd, #6A5ACD);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 6px;
        }

        .boton:hover {
            opacity: 0.88;
            transform: scale(1.02);
        }

        .link-registro {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            color: #999;
        }

        .link-registro a {
            color: #6A5ACD;
            font-weight: bold;
            text-decoration: none;
        }

        .link-registro a:hover { text-decoration: underline; }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card-login">

        <img src="Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="Logo YoSoy" class="logo">
        <div class="titulo">YoSoy</div>
        <div class="subtitulo">Telemedicina en Salud Mental</div>

        <!-- TABS DE ROL -->
        <div class="roles">
            <button class="rol-btn activo" id="tab-paciente" onclick="seleccionarRol('paciente')">
                <span class="icono">🧑</span>
                Paciente
            </button>
            <button class="rol-btn" id="tab-profesional" onclick="seleccionarRol('profesional')">
                <span class="icono">👨‍⚕️</span>
                Profesional
            </button>
            <button class="rol-btn" id="tab-configurador" onclick="seleccionarRol('configurador')">
                <span class="icono">⚙️</span>
                Configurador
            </button>
        </div>

        <!-- FORMULARIO -->
        <form onsubmit="iniciarSesion(event)">

            <div class="campo">
                <label>Usuario</label>
                <input type="text" id="usuario" class="input" placeholder="Ingrese su usuario" required>
            </div>

            <div class="campo">
                <label>Contraseña</label>
                <input type="password" id="contrasena" class="input" placeholder="Ingrese su contraseña" required>
                <span class="ojo" id="btnOjo" onclick="togglePassword()">
                    <svg id="iconoOjoAbierto" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg id="iconoOjoCerrado" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </span>
            </div>

            <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos.</div>

            <button type="submit" class="boton">Ingresar</button>

        </form>

        <span class="link-registro" id="linkRegistro">
            ¿No tenés cuenta? <a href="Pantalla_Usuario/Usuario/consentimiento crear_cuenta.html">Registrate</a>
        </span>
        <span class="link-registro" id="linkRegistroProfesional" style="display:none">
            ¿Sos profesional? <a href="Pantalla_Usuario/Usuario/registro_profesional.html">Registrate acá</a>
        </span>

        <!-- RECUPERACIÓN DE CONTRASEÑA (solo paciente/profesional) -->
        <div id="seccionRecuperacion" style="margin-top:14px">
            <span class="link-registro">
                <a href="#" onclick="toggleRecuperacion(event)">¿Olvidé mi contraseña?</a>
                &nbsp;·&nbsp;
                <a href="#" onclick="toggleConsultarSolicitud(event)">Consultar solicitud</a>
            </span>

            <div id="formRecuperacion" style="display:none;margin-top:12px">
                <div class="campo">
                    <label>Usuario</label>
                    <input type="text" id="userRecuperacion" class="input" placeholder="Tu nombre de usuario">
                </div>
                <button type="button" class="boton" style="height:42px;font-size:15px" onclick="enviarRecuperacion()">
                    Enviar solicitud
                </button>
                <div id="msgRecuperacion" style="margin-top:8px;font-size:13px"></div>
            </div>

            <div id="formConsultarSolicitud" style="display:none;margin-top:12px">
                <div class="campo">
                    <label>Usuario</label>
                    <input type="text" id="userConsulta" class="input" placeholder="Tu nombre de usuario">
                </div>
                <button type="button" class="boton" style="height:42px;font-size:15px" onclick="consultarSolicitud()">
                    Consultar
                </button>
                <div id="msgConsulta" style="margin-top:8px;font-size:13px"></div>
            </div>
        </div>

    </div>

    <script>
        // Escape de HTML para datos que cargan los usuarios. En Cambios-Agus vive en shared/ui.js (YS.esc);
        // en main no existe esa capa, asi que el parche de XSS define lo minimo que usa.
        window.YS = window.YS || {};
        YS.esc = YS.esc || (s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]));
        let rolActual = "paciente";

        function seleccionarRol(rol) {
            rolActual = rol;
            document.querySelectorAll(".rol-btn").forEach(b => b.classList.remove("activo"));
            document.getElementById(`tab-${rol}`).classList.add("activo");
            document.getElementById("errorMsg").style.display = "none";

            document.getElementById("linkRegistro").style.display =
                rol === "paciente" ? "block" : "none";
            document.getElementById("linkRegistroProfesional").style.display =
                rol === "profesional" ? "block" : "none";

            const esUserFinal = rol === "paciente" || rol === "profesional";
            document.getElementById("seccionRecuperacion").style.display = esUserFinal ? "block" : "none";
            if (!esUserFinal) {
                document.getElementById("formRecuperacion").style.display = "none";
                document.getElementById("formConsultarSolicitud").style.display = "none";
            }
        }

        function togglePassword() {
            const input = document.getElementById("contrasena");
            const mostrar = input.type === "password";
            input.type = mostrar ? "text" : "password";
            document.getElementById("iconoOjoAbierto").style.display = mostrar ? "none" : "";
            document.getElementById("iconoOjoCerrado").style.display = mostrar ? "" : "none";
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;
            const errorMsg = document.getElementById("errorMsg");
            errorMsg.style.display = "none";

            try {
                const res = await fetch("http://localhost:5000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: usuario, password: contrasena })
                });

                if (res.status === 423) {
                    const data = await res.json().catch(() => ({}));
                    errorMsg.textContent = data.mensaje ?? "Cuenta bloqueada temporalmente. Intentá en 15 minutos.";
                    errorMsg.style.display = "block";
                    return;
                }

                if (!res.ok) {
                    errorMsg.textContent = "Usuario o contraseña incorrectos.";
                    errorMsg.style.display = "block";
                    return;
                }

                const data = await res.json();

                if (data.rol !== rolActual) {
                    errorMsg.textContent = "Rol incorrecto para este usuario.";
                    errorMsg.style.display = "block";
                    return;
                }

                localStorage.setItem("idUsuario", data.idUsuario);
                localStorage.setItem("rol", data.rol);

                if (data.rol === "paciente") {
                    localStorage.setItem("idPaciente", data.idPaciente);
                    window.location.href = "Pantalla_Paciente/dashboard.html";
                } else if (data.rol === "profesional") {
                    localStorage.setItem("idProfesional", data.idProfesional);
                    window.location.href = "Pantalla_Profesional/nuevo_dashboard.html";
                } else {
                    window.location.href = "Pantalla_Configurador/dashboard.html";
                }

            } catch {
                errorMsg.textContent = "No se pudo conectar con el servidor.";
                errorMsg.style.display = "block";
            }
        }

        function toggleRecuperacion(e) {
            e.preventDefault();
            const f = document.getElementById("formRecuperacion");
            const visible = f.style.display !== "none";
            f.style.display = visible ? "none" : "block";
            document.getElementById("formConsultarSolicitud").style.display = "none";
            document.getElementById("msgRecuperacion").textContent = "";
        }

        function toggleConsultarSolicitud(e) {
            e.preventDefault();
            const f = document.getElementById("formConsultarSolicitud");
            const visible = f.style.display !== "none";
            f.style.display = visible ? "none" : "block";
            document.getElementById("formRecuperacion").style.display = "none";
            document.getElementById("msgConsulta").textContent = "";
        }

        async function enviarRecuperacion() {
            const username = document.getElementById("userRecuperacion").value.trim();
            const msg = document.getElementById("msgRecuperacion");
            if (!username) { msg.textContent = "Ingresá tu usuario."; msg.style.color = "#e74c3c"; return; }
            try {
                const res = await fetch("http://localhost:5000/recuperacion-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username })
                });
                if (res.ok) {
                    msg.style.color = "#27ae60";
                    msg.textContent = "Solicitud enviada. El administrador la revisará.";
                } else if (res.status === 409) {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "Ya tenés una solicitud pendiente.";
                } else if (res.status === 404) {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "Usuario no encontrado.";
                } else {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "Error al enviar la solicitud.";
                }
            } catch {
                msg.style.color = "#e74c3c";
                msg.textContent = "No se pudo conectar con el servidor.";
            }
        }

        async function consultarSolicitud() {
            const username = document.getElementById("userConsulta").value.trim();
            const msg = document.getElementById("msgConsulta");
            if (!username) { msg.textContent = "Ingresá tu usuario."; msg.style.color = "#e74c3c"; return; }
            try {
                const res = await fetch(`http://localhost:5000/recuperacion-password/estado/${encodeURIComponent(username)}`);
                if (res.status === 404) {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "No hay solicitudes para este usuario.";
                    return;
                }
                const data = await res.json();
                if (data.estado === "Pendiente") {
                    msg.style.color = "#888";
                    msg.textContent = "Tu solicitud está siendo revisada por el administrador.";
                } else if (data.estado === "Aceptada") {
                    msg.style.color = "#27ae60";
                    msg.innerHTML = `Tu nueva contraseña temporal es: <strong>${YS.esc(data.passwordTemporal)}</strong>. Ingresá con ella y cambiala cuanto antes.`;
                } else if (data.estado === "Rechazada") {
                    msg.style.color = "#e74c3c";
                    msg.textContent = "Tu solicitud fue rechazada. Contactá al administrador.";
                }
            } catch {
                msg.style.color = "#e74c3c";
                msg.textContent = "No se pudo conectar con el servidor.";
            }
        }
    </script>

</body>
</html>
