<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy · Sala de video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../shared/tema.css">
    <style>
        /* Propio de esta página; colores, tipografía y botones salen de ../shared/tema.css */
        .sala-espera { max-width: 560px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 20px; margin-bottom: 12px; }
        .card h3 { font-size: var(--fs-xl); font-weight: 600; color: var(--text); margin: 0 0 6px; }
        .texto-ayuda { font-size: var(--fs-md); color: var(--text-3); margin: 0; }
        .codigo-input { display: flex; gap: 8px; margin-top: 16px; }
        .codigo-input .ui-input {
            flex: 1; height: 44px; font-family: var(--mono); font-size: var(--fs-lg); font-weight: 600;
            letter-spacing: .12em; text-transform: uppercase; color: var(--accent-strong);
        }
        /* El estilo de arriba es para el código ya tipeado (mayúsculas, espaciado); el
           placeholder es una frase, no un código, así que se ve con texto normal. */
        .codigo-input .ui-input::placeholder {
            font-family: var(--font); font-size: var(--fs-md); font-weight: 400;
            letter-spacing: normal; text-transform: none; color: var(--text-4);
        }
        .estado-box { margin-top: 12px; font-size: var(--fs-md); color: var(--text-3); min-height: 1.4em; }
        .estado-box.conectado { color: var(--ok); font-weight: 500; }
        .estado-box.error { color: var(--danger); }
        .videos-grid { display: grid; grid-template-columns: 1fr 220px; gap: 10px; margin-bottom: 12px; }
        .video-wrap { position: relative; background: #111; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16/9; }
        .video-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .video-label { position: absolute; bottom: 8px; left: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: var(--fs-sm); padding: 2px 8px; border-radius: var(--r-sm); }
        .controles { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
        .estado { font-size: var(--fs-md); color: var(--text-3); }
        @media (max-width: 760px) { .videos-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="ui-pagina-ancha">
<!-- Barra superior y encabezado: shared/shell.js -->
<main class="ui-pagina">
<div class="ui-contenido">

    <!-- PANTALLA DE ESPERA -->
    <div id="pantalla-espera" class="sala-espera">
        <div class="card">
            <h3>Unirse a la sesión</h3>
            <p class="texto-ayuda">
                Tu profesional te va a compartir un código. Ingresalo acá para conectarte a la videollamada.
            </p>
            <div class="codigo-input">
                <input
                    type="text"
                    id="input-sala"
                    class="ui-input"
                    placeholder="Ingresá el código de tu sala"
                    maxlength="30"
                    aria-label="Código de sala"
                    autocomplete="off"
                    oninput="this.value = this.value.toUpperCase()"
                >
                <button class="ui-btn ui-btn--primary ui-btn--lg" id="btn-conectar" onclick="conectarse()">
                    Conectarme
                </button>
            </div>
            <div class="estado-box" id="estado-espera" aria-live="polite"></div>
        </div>
    </div>

    <!-- PANTALLA DE SESIÓN -->
    <div id="pantalla-sesion" class="oculto">
        <div class="videos-grid">
            <div class="video-wrap">
                <video id="vid-profesional" autoplay playsinline></video>
                <span class="video-label">Tu profesional</span>
            </div>
            <div class="video-wrap">
                <video id="vid-paciente" autoplay playsinline muted></video>
                <span class="video-label">Vos</span>
            </div>
        </div>
        <div class="controles">
            <button class="ui-btn ui-btn--danger-solido" onclick="finalizarSesion()">Finalizar sesión</button>
            <span class="estado" id="estado-txt" aria-live="polite">Conectando…</span>
        </div>
    </div>

</div>
</main>

<script src="../shared/ui.js"></script>
<script src="../shared/shell.js"></script>
<script>YS.shell.iniciar({ rol: "paciente", activo: "sesion" });</script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const SIGNAL = 'http://localhost:3001';
let pc, stream, socket, sala;

// El link de la notificación (y los botones del panel) traen el código: ?sala=SALA-...
// Queda cargado y solo falta "Conectarme" (la cámara se pide recién ahí).
(function codigoDesdeElLink() {
    const codigo = (YS.param('sala') || '').trim().toUpperCase();
    if (!codigo) return;
    document.getElementById('input-sala').value = codigo;
    const estado = document.getElementById('estado-espera');
    estado.textContent = 'El código de tu sala ya está cargado. Tocá "Conectarme" cuando estés listo.';
    estado.className = 'estado-box';
    document.getElementById('btn-conectar').focus();
})();

async function conectarse() {
    sala = document.getElementById('input-sala').value.trim().toUpperCase();
    const estadoBox = document.getElementById('estado-espera');

    if (!sala) {
        estadoBox.textContent = 'Ingresá el código de sala.';
        estadoBox.className = 'estado-box error';
        return;
    }

    estadoBox.textContent = 'Conectando...';
    estadoBox.className = 'estado-box';
    document.getElementById('btn-conectar').disabled = true;

    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch {
        estadoBox.textContent = 'No se pudo acceder a la cámara o micrófono.';
        estadoBox.className = 'estado-box error';
        document.getElementById('btn-conectar').disabled = false;
        return;
    }

    document.getElementById('vid-paciente').srcObject = stream;
    document.getElementById('pantalla-espera').classList.add('oculto');
    document.getElementById('pantalla-sesion').classList.remove('oculto');
    document.getElementById('estado-txt').textContent = 'Conectando con el profesional...';

    // Configurar WebRTC
    pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    stream.getTracks().forEach(t => pc.addTrack(t, stream));

    pc.ontrack = e => {
        document.getElementById('vid-profesional').srcObject = e.streams[0];
        document.getElementById('estado-txt').textContent = '🟢 Sesión en curso';
    };

    pc.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', { roomId: sala, candidate: e.candidate });
    };

    // Conectar al servidor de señalización
    socket = io(SIGNAL);

    // Cuando el socket se conecta, unirse a la sala
    socket.on('connect', () => {
        socket.emit('join-room', { roomId: sala, role: 'paciente' });
    });

    // El servidor confirma que nos unimos → mandar offer inmediatamente
    socket.on('joined', async () => {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', { roomId: sala, offer });
    });

    // Si el profesional se une después que nosotros → mandar offer
    socket.on('user-joined', async () => {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('offer', { roomId: sala, offer });
    });

    socket.on('answer', async ({ answer }) => {
        await pc.setRemoteDescription(answer);
    });

    socket.on('ice-candidate', async ({ candidate }) => {
        try { await pc.addIceCandidate(candidate); } catch {}
    });

    socket.on('user-left', () => {
        document.getElementById('estado-txt').textContent = '⚠ El profesional se desconectó.';
    });
}

function finalizarSesion() {
    stream?.getTracks().forEach(t => t.stop());
    pc?.close();
    socket?.disconnect();
    document.getElementById('pantalla-sesion').classList.add('oculto');
    document.getElementById('pantalla-espera').classList.remove('oculto');
    document.getElementById('input-sala').value = '';
    document.getElementById('btn-conectar').disabled = false;
    document.getElementById('estado-espera').textContent = 'Sesión finalizada.';
    document.getElementById('estado-espera').className = 'estado-box conectado';
}
</script>
</body>
</html>
