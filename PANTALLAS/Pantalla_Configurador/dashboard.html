<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy · Panel de gestión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../shared/tema.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <!-- Roles y permisos: panel de GESTIÓN del Configurador, de CRM y de Admisión/Auditoría del módulo
         Profesional. Cada módulo ve solo sus secciones (ver MODULO en js/dashboard.js).
         La barra superior, el menú y el encabezado de página los arma shared/shell.js.
         Cada sección (mostrarTab) se dibuja en #contenido. CRM > Chats y Escalamientos usan
         #vistaChatsCRM en vez de #contenido: la bandeja (js/bandeja.js, cargada por shell.js
         si la mensajería está disponible) se dibuja ahí una sola vez y se muestra u oculta al
         cambiar de sección, sin recrearla cada vez (mantiene el polling y el contador del botón
         de la barra superior activos aunque no se esté viendo Chats). -->
    <main class="ui-pagina">
        <div class="ui-contenido contenido" id="contenido"></div>
        <div id="vistaChatsCRM" class="vista-chats-crm oculto"></div>
    </main>

    <!-- Modal compartido: asignar profesional, cambio directo y aceptar solicitud de cambio -->
    <div class="ui-modal-fondo modal-fijo" id="modalDerivOverlay" onclick="if (event.target === this) cerrarModalDeriv()">
        <div class="ui-modal" id="modalDerivPanel" role="dialog" aria-modal="true" aria-labelledby="modalDerivTitulo" tabindex="-1">
            <div class="ui-modal-cabecera">
                <h2 class="ui-modal-titulo" id="modalDerivTitulo">Aceptar solicitud de cambio</h2>
                <button type="button" class="ui-btn ui-btn--ghost ui-btn--icono ui-modal-cerrar" aria-label="Cerrar" onclick="cerrarModalDeriv()">✕</button>
            </div>
            <div class="ui-modal-cuerpo" id="modalDerivBody"></div>
            <div class="ui-modal-pie">
                <button type="button" class="ui-btn" onclick="cerrarModalDeriv()">Cancelar</button>
                <button type="button" class="ui-btn ui-btn--primary" id="modalDerivConfirmar" onclick="confirmarAceptarDeriv()">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal compartido de la Fase 2: grupos, reglas de derivación, confirmar/corregir una
         derivación y reasignar un caso. El cuerpo y la acción de Confirmar cambian según
         para qué se abrió (ver abrirModalCaso() en dashboard.js). -->
    <div class="ui-modal-fondo modal-fijo" id="modalCasoOverlay" onclick="if (event.target === this) cerrarModalCaso()">
        <div class="ui-modal" id="modalCasoPanel" role="dialog" aria-modal="true" aria-labelledby="modalCasoTitulo" tabindex="-1">
            <div class="ui-modal-cabecera">
                <h2 class="ui-modal-titulo" id="modalCasoTitulo">Editar</h2>
                <button type="button" class="ui-btn ui-btn--ghost ui-btn--icono ui-modal-cerrar" aria-label="Cerrar" onclick="cerrarModalCaso()">✕</button>
            </div>
            <div class="ui-modal-cuerpo" id="modalCasoBody"></div>
            <div class="ui-modal-pie">
                <button type="button" class="ui-btn" onclick="cerrarModalCaso()">Cancelar</button>
                <button type="button" class="ui-btn ui-btn--primary" id="modalCasoConfirmar" onclick="confirmarModalCaso()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal de edición de un registro (tabla genérica y turnos) -->
    <div class="ui-modal-fondo modal-fijo" id="modalOverlay" onclick="if (event.target === this) cerrarModal()">
        <div class="ui-modal" id="modalPanel" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" tabindex="-1">
            <div class="ui-modal-cabecera">
                <h2 class="ui-modal-titulo" id="modalTitulo">Editar</h2>
                <button type="button" class="ui-btn ui-btn--ghost ui-btn--icono ui-modal-cerrar" aria-label="Cerrar" onclick="cerrarModal()">✕</button>
            </div>
            <div class="ui-modal-cuerpo" id="modalBody"></div>
            <div class="ui-modal-pie">
                <button type="button" class="ui-btn" onclick="cerrarModal()">Cancelar</button>
                <button type="button" class="ui-btn ui-btn--primary" id="modalConfirmar" onclick="guardar()">Guardar cambios</button>
            </div>
        </div>
    </div>

    <script src="../shared/ui.js"></script>
    <script src="../shared/shell.js"></script>
    <script src="../shared/whatsapp-estado.js"></script>
    <script src="../js/sesion.js"></script>
    <script src="js/usuarios.js"></script>
    <script src="js/leads.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
