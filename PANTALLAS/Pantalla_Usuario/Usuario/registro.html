<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Paciente - YoSoy</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="contenedor-registro">
    <div class="card-registro">

        <img src="img/logo_SINFONDO.png" alt="Logo YoSoy" class="logo-registro">
        <div class="titulo-reg">YoSoy</div>
        <div class="subtitulo-reg">Registro de Paciente</div>

        <form id="formRegistro" novalidate>

            <!-- DATOS PERSONALES -->
            <div class="seccion-titulo-reg">Datos Personales</div>

            <div class="input-row">
                <div class="campo">
                    <label>Nombre *</label>
                    <input type="text" id="nombre" class="input-reg">
                </div>
                <div class="campo">
                    <label>Segundo Nombre</label>
                    <input type="text" id="segundoNombre" class="input-reg">
                </div>
            </div>

            <div class="input-row">
                <div class="campo">
                    <label>Apellido *</label>
                    <input type="text" id="apellido" class="input-reg">
                </div>
                <div class="campo">
                    <label>Segundo Apellido</label>
                    <input type="text" id="segundoApellido" class="input-reg">
                </div>
            </div>

            <div class="input-row">
                <div class="campo">
                    <label>DNI *</label>
                    <input type="text" id="dni" class="input-reg">
                </div>
                <div class="campo">
                    <label>Sexo *</label>
                    <select id="sexo" class="input-reg">
                        <option value="" disabled selected hidden>Seleccione</option>
                        <option>Masculino</option>
                        <option>Femenino</option>
                        <option>Otros</option>
                    </select>
                </div>
            </div>

            <div class="input-row">
                <div class="campo">
                    <label>Fecha de Nacimiento *</label>
                    <input type="date" id="fechaNacimiento" class="input-reg">
                </div>
                <div class="campo">
                    <label>Teléfono</label>
                    <input type="text" id="telefono" class="input-reg">
                </div>
            </div>

            <div class="campo">
                <label>Email *</label>
                <input type="email" id="email" class="input-reg">
            </div>

            <!-- DOMICILIO -->
            <div class="seccion-titulo-reg">Domicilio</div>

            <div class="input-row">
                <div class="campo" style="flex:2;">
                    <label>Calle *</label>
                    <input type="text" id="domicilio" class="input-reg">
                </div>
                <div class="campo" style="flex:1;">
                    <label>Número *</label>
                    <input type="number" id="numero" class="input-reg">
                </div>
            </div>

            <div class="campo">
                <label>Provincia *</label>
                <input type="text" id="provincia" class="input-reg">
            </div>

            <!-- DATOS TUTOR -->
            <div id="seccionTutor" class="seccion-tutor">

                <div class="seccion-titulo-reg">Datos del Tutor Responsable</div>

                <div class="input-row">
                    <div class="campo">
                        <label>Nombre *</label>
                        <input type="text" id="tutorNombre" class="input-reg">
                    </div>
                    <div class="campo">
                        <label>Segundo Nombre</label>
                        <input type="text" id="tutorSegundoNombre" class="input-reg">
                    </div>
                </div>

                <div class="input-row">
                    <div class="campo">
                        <label>Apellido *</label>
                        <input type="text" id="tutorApellido" class="input-reg">
                    </div>
                    <div class="campo">
                        <label>Segundo Apellido</label>
                        <input type="text" id="tutorSegundoApellido" class="input-reg">
                    </div>
                </div>

                <div class="input-row">
                    <div class="campo">
                        <label>Sexo *</label>
                        <select id="tutorSexo" class="input-reg">
                            <option value="" disabled selected hidden>Seleccione</option>
                            <option>Masculino</option>
                            <option>Femenino</option>
                            <option>Otros</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label>Fecha de Nacimiento *</label>
                        <input type="date" id="tutorFechaNacimiento" class="input-reg">
                    </div>
                </div>

                <div class="input-row">
                    <div class="campo">
                        <label>Email *</label>
                        <input type="email" id="tutorEmail" class="input-reg">
                    </div>
                    <div class="campo">
                        <label>Parentesco *</label>
                        <input type="text" id="parentesco" class="input-reg">
                    </div>
                </div>

                <div class="campo">
                    <label>Domicilio *</label>
                    <input type="text" id="tutorDomicilio" class="input-reg">
                </div>

            </div>

            <!-- BOTON -->
            <button type="submit" class="boton-reg">Continuar</button>

        </form>

    </div>
</div>

<script src="js/app.js"></script>

</body>
</html>
