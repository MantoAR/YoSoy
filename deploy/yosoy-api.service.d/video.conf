# Drop-in para que yosoy-api también lea /opt/yosoy/config/video.env (secretos y servidores ICE de las
# videollamadas), sin tocar su unit original ni su .env principal. Instalar como:
#   /etc/systemd/system/yosoy-api.service.d/video.conf
# seguido de: sudo systemctl daemon-reload && sudo systemctl restart yosoy-api
# (docs/DESPLIEGUE_VIDEO.md, paso e). Mismo esquema que whatsapp.conf, con una diferencia a propósito: el "-".
[Service]
# El "-" hace que un video.env ausente NO impida que la API arranque: sin ese archivo la API levanta igual y
# /video/acceso contesta 503 (docs/VIDEOLLAMADAS.md). whatsapp.conf no lo lleva y, si falta su archivo, systemd
# no arranca la API; acá no conviene: la API no puede quedar caída por una función opcional.
EnvironmentFile=-/opt/yosoy/config/video.env
