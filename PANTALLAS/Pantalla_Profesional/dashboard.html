<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy - Panel Profesional</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="../Pantalla_Usuario/Usuario/img/logo_SINFONDO.png" alt="Logo">
            YoSoy <span class="badge-panel">Panel Profesional</span>
        </div>
        <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
    </nav>

    <div class="tabs-bar">
        <button class="tab-btn" data-sec="inicio"   onclick="mostrarSeccion('inicio')">Inicio</button>
        <button class="tab-btn" data-sec="agenda"   onclick="mostrarSeccion('agenda')">Mi Agenda</button>
        <button class="tab-btn" data-sec="pacientes" onclick="mostrarSeccion('pacientes')">Mis Pacientes</button>
        <button class="tab-btn" data-sec="sesion"   onclick="mostrarSeccion('sesion')">📹 Sesión</button>
        <button class="tab-btn" data-sec="perfil"   onclick="mostrarSeccion('perfil')">Mi Perfil</button>
    </div>

    <main class="contenido" id="contenido"></main>

    <script src="../js/sesion.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
