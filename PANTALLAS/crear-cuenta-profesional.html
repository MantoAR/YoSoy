<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoSoy - Crear cuenta profesional</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f5ff, #ddd0f5, #c0a8ee);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 36px;
            width: 420px;
            box-shadow: 0 12px 40px rgba(100, 80, 180, 0.18);
            text-align: center;
        }

        .titulo {
            font-size: 36px;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 2px;
        }

        .subtitulo {
            font-size: 13px;
            color: #9D6BCF;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .campo {
            text-align: left;
            margin-bottom: 16px;
            position: relative;
        }

        .campo label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #6A5ACD;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .input {
            width: 100%;
            height: 46px;
            border: 2px solid #e0d4f5;
            border-radius: 12px;
            padding: 0 40px 0 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input:focus { border-color: #6A5ACD; }

        .ojo {
            position: absolute;
            right: 13px;
            bottom: 12px;
            cursor: pointer;
            font-size: 18px;
            color: #aaa;
            user-select: none;
        }

        .ojo:hover { color: #6A5ACD; }

        .boton {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, #0d6efd, #6A5ACD);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .boton:hover { opacity: 0.9; }

        .mensaje {
            margin-top: 14px;
            font-size: 14px;
        }

        .link-volver {
            display: block;
            margin-top: 20px;
            font-size: 13px;
            color: #6A5ACD;
            text-decoration: none;
        }

        .link-volver:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="titulo">YoSoy</div>
    <div class="subtitulo">Crear cuenta profesional</div>

    <div id="formSection">
        <div class="campo">
            <label>Nombre de usuario</label>
            <input type="text" id="username" class="input" placeholder="Elegí un nombre de usuario" autocomplete="off">
        </div>
        <div class="campo">
            <label>Contraseña</label>
            <input type="password" id="pass1" class="input" placeholder="Elegí una contraseña">
            <span class="ojo" onclick="togglePass('pass1')">&#128065;</span>
        </div>
        <div class="campo">
            <label>Confirmar contraseña</label>
            <input type="password" id="pass2" class="input" placeholder="Repetí tu contraseña">
            <span class="ojo" onclick="togglePass('pass2')">&#128065;</span>
        </div>
        <button class="boton" onclick="crearCuenta()">Crear cuenta</button>
        <div id="mensaje" class="mensaje"></div>
    </div>

    <a href="/pantallas/index.html" class="link-volver">Volver al inicio de sesión</a>
</div>

<script>
    function togglePass(id) {
        const inp = document.getElementById(id);
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function obtenerToken() {
        return new URLSearchParams(window.location.search).get('token');
    }

    async function crearCuenta() {
        const msg = document.getElementById('mensaje');
        const username = document.getElementById('username').value.trim();
        const pass1 = document.getElementById('pass1').value;
        const pass2 = document.getElementById('pass2').value;
        const token = obtenerToken();

        if (!token) {
            msg.style.color = '#e74c3c';
            msg.textContent = 'Link inválido.';
            return;
        }
        if (!username) {
            msg.style.color = '#e74c3c';
            msg.textContent = 'Ingresá un nombre de usuario.';
            return;
        }
        if (!pass1) {
            msg.style.color = '#e74c3c';
            msg.textContent = 'Ingresá una contraseña.';
            return;
        }
        if (pass1 !== pass2) {
            msg.style.color = '#e74c3c';
            msg.textContent = 'Las contraseñas no coinciden.';
            return;
        }
        if (pass1.length < 6) {
            msg.style.color = '#e74c3c';
            msg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
            return;
        }

        try {
            const res = await fetch('/profesionales/activar-cuenta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, username, password: pass1 })
            });
            const data = await res.json();

            if (res.ok) {
                msg.style.color = '#27ae60';
                msg.textContent = data.mensaje;
                document.getElementById('formSection').style.opacity = '0.4';
                document.getElementById('formSection').style.pointerEvents = 'none';
            } else if (res.status === 409) {
                msg.style.color = '#e74c3c';
                msg.textContent = data.mensaje ?? 'Ese nombre de usuario ya está en uso.';
            } else {
                msg.style.color = '#e74c3c';
                msg.textContent = data.mensaje ?? 'Ocurrió un error.';
            }
        } catch {
            msg.style.color = '#e74c3c';
            msg.textContent = 'No se pudo conectar con el servidor.';
        }
    }
</script>
</body>
</html>
